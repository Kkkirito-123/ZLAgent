# ZLAgent MCP server registry (v0.14)
#
# Each entry under ``servers:`` becomes one stdio MCP subprocess on
# startup. Tools advertised by the server are auto-registered into the
# agent's tool registry as ``mcp__<server_name>__<tool_name>`` and default
# to permission ``confirm`` (so every invocation triggers an IM yes/no
# unless explicitly promoted in ``tools.override_permission``).
#
# Useful starting points (uncomment one when ready):
#
# servers:
#
#   filesystem:
#     command: "npx"
#     args:
#       - "-y"
#       - "@modelcontextprotocol/server-filesystem"
#       - "/app/workspace"
#     description: "Sandboxed file ops scoped to /app/workspace."
#     tools:
#       override_permission:
#         read_file: safe
#         list_directory: safe
#
#   playwright:
#     command: "npx"
#     args:
#       - "-y"
#       - "@playwright/mcp@latest"
#     description: "Headless browser automation (subsumes the legacy v0.15 plan)."
#     # All playwright tools mutate the browser state — keep them confirm.
#
#   github:
#     command: "npx"
#     args:
#       - "-y"
#       - "@modelcontextprotocol/server-github"
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
#     description: "Read PRs / issues / commits. Token via GITHUB_TOKEN env var."
#
#   youtube-transcript:
#     command: "uvx"
#     args:
#       - "mcp-server-youtube-transcript"
#     description: |
#       Extract subtitles/transcripts from YouTube URLs via yt-dlp.
#       No API key needed. Tool: get_transcript(url, lang='zh-Hans').
#       Install prereq: pip install yt-dlp
#
#   feishu:
#     command: "npx"
#     args:
#       - "-y"
#       - "@larksuiteoapi/lark-mcp"
#       - "--app-id"
#       - "${FEISHU_APP_ID}"
#       - "--app-secret"
#       - "${FEISHU_APP_SECRET}"
#     env:
#       FEISHU_APP_ID: "${FEISHU_APP_ID}"
#       FEISHU_APP_SECRET: "${FEISHU_APP_SECRET}"
#     description: |
#       Feishu/Lark toolkit: calendar, approval, contacts, messages.
#       Requires Feishu developer app credentials in environment.
#     tools:
#       override_permission:
#         lark_get_user_info: safe
#         lark_list_calendar_events: safe
#
#   pdf:
#     command: "uvx"
#     args:
#       - "mcp-server-markitdown"
#     description: |
#       Convert PDF / DOCX / XLSX / PPTX to Markdown with natural language.
#       Tool: convert_to_markdown(source_path_or_url).
#       All read-only — keep permission safe for read tools.
#     tools:
#       override_permission:
#         convert_to_markdown: safe
#
#   # ── open-websearch (v0.40.4) ────────────────────────────────────────
#   # Multi-engine web search via MCP. Falls back across bing / baidu /
#   # duckduckgo / brave / exa / csdn / juejin / startpage instead of
#   # dying on one provider's captcha like the built-in ``web_search``
#   # does. Also exposes content-fetch tools (GitHub README, generic
#   # web/Markdown extraction with Readability) that complement
#   # ``read_url``. Repo: Aas-ee/open-webSearch (checked in under
#   # ./open-webSearch-main). See docs/dev-open-websearch.md for setup.
#   #
#   # Pick ONE of the two transport styles below — they are mutually
#   # exclusive. Stdio = one subprocess per ZLAgent worker, simplest;
#   # HTTP = one shared daemon, lets multiple workers reuse it.

servers:
  websearch:
    command: "npx"
    args:
      - "-y"
      - "open-websearch@latest"
    env:
      MODE: stdio
      DEFAULT_SEARCH_ENGINE: duckduckgo
      ALLOWED_SEARCH_ENGINES: "duckduckgo,bing,brave,baidu"
      # USE_PROXY: "true"
      # PROXY_URL: "http://127.0.0.1:7890"
    description: |
      Multi-engine web search (no API key). Tools: search,
      fetchWebContent, fetchGithubReadme, fetchCsdnArticle, etc.
      Prefer over the built-in web_search when DuckDuckGo rate-limits.
    tools:
      override_permission:
        # All search and fetch tools are read-only — promote to safe
        # so the LLM can use them without an IM yes/no per call.
        search: safe
        fetchWebContent: safe
        fetchGithubReadme: safe
        fetchCsdnArticle: safe
        fetchJuejinArticle: safe
#
#   # Alternative HTTP transport — same server, started separately as a
#   # long-lived daemon (``npx open-websearch@latest serve``). Useful in
#   # multi-worker / docker-compose deployments where you don't want one
#   # Node subprocess per ZLAgent worker.
#   #
#   # websearch:
#   #   transport: http
#   #   url: "http://127.0.0.1:3000/mcp"
#   #   description: "Multi-engine search via long-lived daemon."
#   #   tools:
#   #     override_permission:
#   #       search: safe
#   #       fetchWebContent: safe
#   #       fetchGithubReadme: safe
#
#   # ── Official reference MCPs (v0.40.5) ───────────────────────────────
#   # Curated from https://github.com/modelcontextprotocol/servers .
#   # All four are read-only, no API key, zero-config. Uncomment whichever
#   # you actually want — they cost almost nothing to keep off but every
#   # ``confirm`` tool the LLM sees inflates its prompt.
#
#   sequentialthinking:
#     command: "npx"
#     args:
#       - "-y"
#       - "@modelcontextprotocol/server-sequential-thinking"
#     description: |
#       Structured thinking helper. The LLM emits a chain of numbered
#       thoughts that can branch and revise, useful for long planning
#       turns (agent 八股, multi-step refactors, debugging trees).
#     tools:
#       override_permission:
#         sequentialthinking: safe
#
#   fetch:
#     command: "uvx"
#     args:
#       - "mcp-server-fetch"
#     description: |
#       Generic URL → Markdown fetcher with html-to-md conversion. A
#       cleaner alternative to ZLAgent's built-in ``read_url`` when the
#       LLM needs structured content from documentation sites / blog
#       posts / arxiv abstracts.
#     tools:
#       override_permission:
#         fetch: safe
#
#   memory:
#     command: "npx"
#     args:
#       - "-y"
#       - "@modelcontextprotocol/server-memory"
#     description: |
#       Knowledge-graph memory: store entities + observations + relations
#       in a persistent JSON graph. Overlaps with ZLAgent's own memory
#       system but is mode-portable (the same MCP graph works from any
#       MCP client), handy for "建立 agent 八股知识库" style asks where
#       you want a graph you can later open in Claude Desktop too.
#     tools:
#       override_permission:
#         search_nodes: safe
#         open_nodes: safe
#         read_graph: safe
#
#   time:
#     command: "uvx"
#     args:
#       - "mcp-server-time"
#     description: |
#       Get-current-time + convert-between-timezones. Cheap to leave on;
#       eliminates the "what timezone is the cron in" failure mode where
#       the LLM hallucinates the wrong UTC offset.
#     tools:
#       override_permission:
#         get_current_time: safe
