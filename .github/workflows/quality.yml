name: zlagent-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zlagent-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Validate repository rules
        run: |
          python3 scripts/test_validate_rules.py
          python3 scripts/validate-rules.py
      - name: Compile
        run: python -m compileall -q backend scripts tests
      - name: Unit and boundary tests
        run: python -m unittest discover -s tests
      - name: Static correctness checks
        run: ruff check backend scripts tests
      - name: Offline product demo
        env:
          ZLAGENT_DEMO_FAST: "1"
          ZLAGENT_MCP_ENABLED: "false"
        run: python scripts/demo_e2e.py
      - name: Offline Harness capability lifecycle demo
        run: python scripts/demo_capability_lifecycle.py
