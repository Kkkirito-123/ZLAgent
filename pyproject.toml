[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-zlagent"
version = "0.1.0"
description = "Rebuilt ZLAgent harness with bounded tools, task checkpoints, and operator controls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=1.28,<2",
]
dev = [
  "mcp>=1.28,<2",
  "mypy>=1.17,<1.18",
  "ruff>=0.12,<0.13",
]

[project.scripts]
zlagent = "re_zlagent.app.cli:main"
re-zlagent-check = "re_zlagent.check:main"
re-zlagent-benchmark = "re_zlagent.benchmark:main"
re-zlagent-effectiveness = "re_zlagent.effectiveness_benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"re_zlagent.harness.evals" = ["corpora/*.json", "corpora/*.jsonl"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "C4", "DTZ", "E4", "E7", "E9", "F", "PIE"]

[tool.mypy]
python_version = "3.11"
files = ["src/re_zlagent"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
