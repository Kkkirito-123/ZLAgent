name: zlagent

services:
  zlagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR_URL: ${APT_MIRROR_URL:-}
    image: zlagent:local
    container_name: zlagent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ZLAGENT_HOST: 0.0.0.0
      ZLAGENT_PORT: 8020
      ZLAGENT_LOG_LEVEL: ${ZLAGENT_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      ZLAGENT_REDIS_URL: ${ZLAGENT_REDIS_URL:-redis://redis:6379/0}
      ZLAGENT_SEARXNG_URL: ${ZLAGENT_SEARXNG_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zlagent:zlagent@postgres:5432/zlagent}
    env_file:
      - .env
    ports:
      - "8020:8020"
    volumes:
      - zlagent_data:/app/data
      - zlagent_config:/app/config
      - zlagent_workspace:/app/workspace
      - zlagent_packages:/app/.packages

  # ---------------------------------------------------------------------
  # On-demand utility: scan QR + auto-register a Weixin DeliveryTarget.
  #
  # Not started by `docker compose up` (gated by the ``setup`` profile).
  # Invoke it when you need to (re-)bind a personal-WeChat identity:
  #
  #     docker compose run --rm weixin-login
  #
  # Reuses zlagent's image (no extra build) and mounts the same
  # ``zlagent_workspace`` named volume, so saved credentials land where
  # the running zlagent service can immediately pick them up. The CLI's
  # auto-register step talks to the running zlagent over the compose
  # network at http://zlagent:8020.
  # ---------------------------------------------------------------------
  weixin-login:
    image: zlagent:local
    profiles: ["setup"]
    depends_on:
      zlagent:
        condition: service_started
    environment:
      ZLAGENT_HOST: 0.0.0.0
      ZLAGENT_PORT: 8020
    volumes:
      - zlagent_workspace:/app/workspace
      - zlagent_config:/app/config
    command:
      - python
      - -m
      - backend.cli.weixin_login
      - --api-base
      - http://zlagent:8020
    tty: true
    stdin_open: true

  redis:
    image: redis:7-alpine
    container_name: zlagent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - zlagent_redis:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zlagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zlagent
      POSTGRES_USER: zlagent
      POSTGRES_PASSWORD: zlagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zlagent -d zlagent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - zlagent_postgres:/var/lib/postgresql/data

volumes:
  zlagent_data:
  zlagent_config:
  zlagent_workspace:
  zlagent_redis:
  zlagent_packages:
  zlagent_postgres:
